<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>1 minute / 24 hours</title>
<style>
:root{--bg:#0d0f14;--fg:#e8e6e1;--dim:#8a8d96;--acc:#e0a96d;--line:#2a2e38;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f14;--fg:#e8e6e1;--dim:#8a8d96;--acc:#e0a96d;--line:#2a2e38}}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3efe8;--fg:#1c1b19;--dim:#7a766d;--acc:#b5651d;--line:#d6d0c4}}
:root[data-theme="dark"]{--bg:#0d0f14;--fg:#e8e6e1;--dim:#8a8d96;--acc:#e0a96d;--line:#2a2e38}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Hiragino Mincho ProN","Noto Serif JP",Georgia,serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px}
main{width:100%;max-width:860px}
h1{font-weight:400;font-size:clamp(22px,5vw,34px);letter-spacing:.08em;margin:8px 0 4px}
p.sub{color:var(--dim);margin:0 0 20px;font-size:14px;line-height:1.7}
.clock{font-size:clamp(40px,12vw,84px);font-variant-numeric:tabular-nums;letter-spacing:.04em;margin:8px 0 0}
.pos{color:var(--acc);font-variant-numeric:tabular-nums;font-size:15px;margin-bottom:12px}
canvas{width:100%;height:380px;cursor:pointer;display:block;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
button,label.btn{font:inherit;background:none;color:var(--fg);border:1px solid var(--fg);padding:10px 22px;cursor:pointer;letter-spacing:.1em;display:inline-block}
button:hover,label.btn:hover{background:var(--fg);color:var(--bg)}
#enter{margin:12px 0}
#msg{color:var(--dim);font-size:13px;margin-top:10px;min-height:1.4em}
#rec{display:none;margin:12px 0}
.recrow{font-size:20px;margin-bottom:10px;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#d9453b;margin-right:8px;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.25}}
.bar{height:6px;background:var(--line);margin-bottom:8px}.bar i{display:block;height:100%;width:0;background:var(--acc)}
.bar.lv{height:4px}.bar.lv i{background:var(--fg);transition:width .08s}

<body>

<main>
<h1>1 minute / 24 hours</h1>
<p class="sub">まずマイクで1分間録音します。その音を、1日かけて聴く。現在時刻（0:00→24:00）が、録音の冒頭から終端までの位置に対応します。録音はこのページのメモリ上にだけ保持され、どこにも送信・保存されません。</p>
<button id="enter">Enter（マイクで1分録音します）</button>
<div id="rec"><div class="recrow"><span class="dot"></span><b>REC</b> <span id="rt">0:00 / 1:00</span></div><div class="bar"><i id="prog"></i></div><div class="bar lv"><i id="lvl"></i></div><p class="sub">周りの音、声、環境音など、1分間なんでも。入力レベルが動いていれば録れています。</p><button id="stopRec">ここで録音を終える</button></div>
<div class="clock" id="clock">--:--:--</div>
<div class="pos" id="pos">&nbsp;</div>
<canvas id="cv"></canvas>
<div id="ctl">
 <button id="tg" aria-label="menu">‹</button>
 <div id="panel">
  <div class="row"><label>音量</label><input id="vol" type="range" min="0" max="1" step="0.01" value="0.6"></div>
  <div class="row"><label>リバーブ</label><input id="rev" type="range" min="0" max="1" step="0.01" value="0.6"></div>
  <div class="row"><label>ドローン度</label><input id="tone" type="range" min="0" max="1" step="0.01" value="0.7"></div>
  <div class="row"><label>試聴：時刻を <b id="offv">+0</b> 時間ずらす</label><input id="off" type="range" min="0" max="23.5" step="0.5" value="0"></div>
  <div class="two"><button id="again">録り直す（1分）</button><label class="btn">ファイルから<input id="file" type="file" accept="audio/*" hidden></label></div>
 </div>
</div>
<div id="msg"></div>

<script>
// ---------- DSP（ワークレット/フォールバック共通） ----------
function FFT(n){const rev=new Uint32Array(n),cs=new Float32Array(n/2),sn=new Float32Array(n/2),b=Math.log2(n);
for(let i=0;i<n;i++){let r=0;for(let j=0;j<b;j++)r|=((i>>j)&1)<<(b-1-j);rev[i]=r}
for(let i=0;i<n/2;i++){cs[i]=Math.cos(2*Math.PI*i/n);sn[i]=-Math.sin(2*Math.PI*i/n)}
return function(re,im){for(let i=0;i<n;i++){const j=rev[i];if(j>i){let t=re[i];re[i]=re[j];re[j]=t;t=im[i];im[i]=im[j];im[j]=t}}
for(let s=2;s<=n;s<<=1){const h=s>>1,st=n/s;for(let i=0;i<n;i+=s)for(let k=0;k<h;k++){const c=cs[k*st],d=sn[k*st],a=i+k,e=a+h,tr=re[e]*c-im[e]*d,ti=re[e]*d+im[e]*c;re[e]=re[a]-tr;im[e]=im[a]-ti;re[a]+=tr;im[a]+=ti}}}}
class Stretch{
 constructor(d,sr,N=32768){this.d=d;this.N=N;this.h=N/2;this.f=FFT(N);this.t=.7;this.w=new Float32Array(N);
  for(let i=0;i<N;i++)this.w[i]=.5-.5*Math.cos(2*Math.PI*i/N);
  this.re=new Float32Array(N);this.im=new Float32Array(N);this.mag=new Float32Array(N/2+1);
  this.ph=[new Float32Array(N/2+1),new Float32Array(N/2+1)];for(const p of this.ph)for(let k=0;k<p.length;k++)p[k]=Math.random()*6.2832;
  this.ar=[new Float32Array(N),new Float32Array(N)];this.cur=[new Float32Array(this.h),new Float32Array(this.h)];this.nx=[new Float32Array(this.h),new Float32Array(this.h)];
  this.st=0;this.i=this.h;this.pos=0;this.step=d.length/86400/sr}
 // 1ホップの処理を4段階（解析→左IFFT→右IFFT→完了）に分け、1ブロックごとに1段階ずつ実行して負荷の山を避ける
 stage(){const{N,h,d,re,im,mag,w,f}=this;
  if(this.st==0){const L=d.length,p=Math.floor(this.pos),pw=1+1.5*this.t;
   for(let i=0;i<N;i++){re[i]=d[(p+i)%L]*w[i];im[i]=0}
   f(re,im);let e0=0,e1=0;
   for(let k=0;k<=h;k++){const m=Math.hypot(re[k],im[k]);e0+=m*m;const q=Math.pow(m,pw);mag[k]=q;e1+=q*q}
   const s=Math.sqrt(e0/(e1||1));for(let k=0;k<=h;k++)mag[k]*=s;
   this.pos=(this.pos+h*this.step)%L}
  else{const c=this.st-1,ph=this.ph[c],A=this.ar[c],J=(.1+.9*(1-this.t))*Math.PI,g=1.2/N;
   for(let k=0;k<=h;k++){ph[k]+=(k&1?Math.PI:0)+(Math.random()*2-1)*J;const m=mag[k],x=m*Math.cos(ph[k]),y=m*Math.sin(ph[k]);re[k]=x;im[k]=y;if(k>0&&k<h){re[N-k]=x;im[N-k]=-y}}
   im[0]=0;im[h]=0;f(im,re);
   for(let i=0;i<N;i++)A[i]+=re[i]*w[i]*g;
   this.nx[c].set(A.subarray(0,h));A.copyWithin(0,h);A.fill(0,h)}
  this.st++}
 render(L,R,n){if(this.st<3)this.stage();
  for(let i=0;i<n;i++){if(this.i>=this.h){while(this.st<3)this.stage();const t=this.cur;this.cur=this.nx;this.nx=t;this.st=0;this.i=0}
   L[i]=Math.tanh(this.cur[0][this.i]);R[i]=Math.tanh(this.cur[1][this.i]);this.i++}}
 seek(f){this.pos=f*this.d.length}
}
const WORKLET=`${FFT}\n${Stretch}\nclass P extends AudioWorkletProcessor{constructor(){super();this.s=null;this.port.onmessage=e=>{const m=e.data;if(m.d){this.s=new Stretch(m.d,sampleRate);this.s.seek(m.f);this.s.t=this.tt===undefined?.7:this.tt}else if(m.t!==undefined){this.tt=m.t;if(this.s)this.s.t=m.t}else if(this.s)this.s.seek(m.f)}}
process(i,o){const c=o[0];if(this.s)this.s.render(c[0],c[1],c[0].length);return true}}
registerProcessor('ps',P)`;

// ---------- アプリ ----------
const $=id=>document.getElementById(id);
let ctx,node,gain,ana,send,src=null,env=[],started=false;
const DAY=86400;
function offH(){return +$('off').value}
function frac(){const n=new Date();const s=n.getHours()*3600+n.getMinutes()*60+n.getSeconds()+n.getMilliseconds()/1000+offH()*3600;return(s%DAY)/DAY}
function demo(sr){const n=sr*60,d=new Float32Array(n),sc=[0,3,5,7,10,12,15,17];let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
 for(let t=0;t<58;t+=1.7+rnd()*1.5){const f=220*Math.pow(2,sc[Math.floor(rnd()*8)]/12),a=.12+rnd()*.1,s=Math.floor(t*sr),len=Math.min(n-s,sr*4);
  for(let i=0;i<len;i++){const x=i/sr,e=Math.exp(-x*1.4)*Math.min(1,x*80);d[s+i]+=a*e*(Math.sin(6.2832*f*x)+.4*Math.sin(12.566*f*x+x)+.2*Math.sin(18.85*f*x))}}
 let pk=0;for(let i=0;i<n;i++)pk=Math.max(pk,Math.abs(d[i]));for(let i=0;i<n;i++)d[i]*=.9/pk;return d}
function setSource(d){src=d;t0a=performance.now();const B=600,k=Math.floor(d.length/B);env=[];
 for(let b=0;b<B;b++){let m=0;for(let i=b*k;i<(b+1)*k;i+=16)m=Math.max(m,Math.abs(d[i]));env.push(m)}
 const copy=d.slice();send({d:copy,f:frac()},[copy.buffer])}
let dry,wet;
function makeIR(c){const n=c.sampleRate*7|0,b=c.createBuffer(2,n,c.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);let lp=0;for(let i=0;i<n;i++){const x=i/n,e=Math.pow(1-x,3.5)*(i<2000?i/2000:1);lp+=(Math.random()*2-1-lp)*(.25-.2*x);d[i]=lp*e*.6}}return b}
function setRev(v){wet.gain.value=1.4*v;dry.gain.value=1-.6*v}
async function init(){
 ctx=new(window.AudioContext||window.webkitAudioContext)();
 gain=ctx.createGain();gain.gain.value=+$('vol').value;ana=ctx.createAnalyser();ana.fftSize=2048;ana.smoothingTimeConstant=.9;
 try{
  const url=URL.createObjectURL(new Blob([WORKLET],{type:'text/javascript'}));
  await ctx.audioWorklet.addModule(url);
  node=new AudioWorkletNode(ctx,'ps',{outputChannelCount:[2]});send=(m,t)=>node.port.postMessage(m,t||[]);
 }catch(e){
  $('msg').textContent='AudioWorkletが使えないためScriptProcessorで動作中（負荷が高め）';
  let eng=null,tt=.7;node=ctx.createScriptProcessor(4096,0,2);
  node.onaudioprocess=e=>{if(eng)eng.render(e.outputBuffer.getChannelData(0),e.outputBuffer.getChannelData(1),4096)};
  send=m=>{if(m.t!==undefined){tt=m.t;if(eng)eng.t=tt}if(m.d){eng=new Stretch(m.d,ctx.sampleRate);eng.t=tt}if(m.f!==undefined&&eng)eng.seek(m.f)};
 }
 const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=7000;dry=ctx.createGain();wet=ctx.createGain();const cv2=ctx.createConvolver();cv2.buffer=makeIR(ctx);
 node.connect(lp);lp.connect(dry);lp.connect(cv2);cv2.connect(wet);dry.connect(gain);wet.connect(gain);gain.connect(ana);ana.connect(ctx.destination);
 setRev(+$('rev').value);send({t:+$('tone').value});
 try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}
 setInterval(()=>send({f:frac()}),15000);
}
$('enter').onclick=async()=>{if(started)return;started=true;$('enter').style.display='none';
 try{await init();await record()}catch(e){$('ctl').style.display='flex';$('msg').textContent='初期化に失敗: '+e.message}};
$('again').onclick=()=>record();
$('tg').onclick=()=>{const o=$('ctl').classList.toggle('open');$('tg').textContent=o?'›':'‹'};
async function record(){
 $('ctl').style.display='none';$('rec').style.display='block';$('msg').textContent='';
 let st;
 try{st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}})}
 catch(e){$('rec').style.display='none';$('ctl').style.display='flex';$('msg').textContent='マイクを使えませんでした（'+e.name+'）。デモ音源を再生します。';if(!src)setSource(demo(ctx.sampleRate));return}
 const an=ctx.createAnalyser();an.fftSize=1024;ctx.createMediaStreamSource(st).connect(an);
 const mr=new MediaRecorder(st),ch=[],done=new Promise(r=>mr.onstop=r);
 mr.ondataavailable=e=>ch.push(e.data);mr.start();
 const t0=performance.now(),buf=new Uint8Array(an.fftSize);let stop=false;$('stopRec').onclick=()=>{stop=true};
 await new Promise(res=>{const iv=setInterval(()=>{const t=(performance.now()-t0)/1000;an.getByteTimeDomainData(buf);let pk=0;for(const v of buf)pk=Math.max(pk,Math.abs(v-128));
  $('lvl').style.width=Math.min(100,pk/128*160)+'%';$('prog').style.width=Math.min(100,t/60*100)+'%';
  $('rt').textContent=Math.floor(t/60)+':'+p2(Math.floor(t%60))+' / 1:00';
  if(t>=60||stop){clearInterval(iv);res()}},100)});
 mr.stop();await done;st.getTracks().forEach(t=>t.stop());
 $('rec').style.display='none';$('ctl').style.display='flex';
 try{const ab=await ctx.decodeAudioData(await new Blob(ch,{type:mr.mimeType}).arrayBuffer()),n=ab.length,m=new Float32Array(n);
  for(let c=0;c<ab.numberOfChannels;c++){const d=ab.getChannelData(c);for(let i=0;i<n;i++)m[i]+=d[i]/ab.numberOfChannels}
  if(ab.duration<2){$('msg').textContent='録音が短すぎます。もう一度録り直してください。';return}
  setSource(m);$('msg').textContent='録音（'+ab.duration.toFixed(1)+'秒）を24時間に引き延ばしています。メモリ上のみに保持しており、ページを閉じると消えます。'}
 catch(e){$('msg').textContent='録音データを読み込めませんでした'}}
$('vol').oninput=e=>{if(gain)gain.gain.value=+e.target.value};
$('rev').oninput=e=>{if(wet)setRev(+e.target.value)};
$('tone').oninput=e=>{if(send)send({t:+e.target.value})};
$('off').oninput=e=>{$('offv').textContent='+'+e.target.value;if(send)send({f:frac()})};
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;
 try{const buf=await ctx.decodeAudioData(await f.arrayBuffer());const n=buf.length,m=new Float32Array(n);
  for(let c=0;c<buf.numberOfChannels;c++){const ch=buf.getChannelData(c);for(let i=0;i<n;i++)m[i]+=ch[i]/buf.numberOfChannels}
  setSource(m);$('msg').textContent='読み込み: '+f.name+'（'+buf.duration.toFixed(1)+'秒）'}catch(err){$('msg').textContent='読み込めませんでした'}};
// ---------- 描画 ----------
const cv=$('cv'),g=cv.getContext('2d'),p2=n=>String(n).padStart(2,'0');
let t0a=-1;cv.onclick=()=>{if(src)t0a=performance.now()};
const fmt=s=>{s=Math.round(s);return Math.floor(s/3600)+':'+p2(Math.floor(s%3600/60))+':'+p2(s%60)};
function draw(){
 const dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
 if(cv.width!==W*dpr){cv.width=W*dpr;cv.height=H*dpr}
 g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
 const cs=getComputedStyle(document.documentElement),fg=cs.getPropertyValue('--fg'),dim=cs.getPropertyValue('--dim'),acc=cs.getPropertyValue('--acc'),ln=cs.getPropertyValue('--line');
 const f=frac(),top=130,dY=148,dH=64,sp=dY+dH+18,pa=t0a<0?1:Math.min(1,(performance.now()-t0a)/6000),ea=pa<.5?4*pa*pa*pa:1-Math.pow(-2*pa+2,3)/2,sW=W*Math.exp(Math.log(.04)*(1-ea));
 g.fillStyle=dim;g.font='11px sans-serif';g.textAlign='center';
 for(let h=0;h<=24;h+=6){const x=Math.min(W-14,Math.max(14,h/24*W));g.fillText(h+':00',x,H-6);g.fillStyle=ln;g.fillRect(h/24*W,0,1,top+6);g.fillStyle=dim}
 g.fillStyle=dim;const B=env.length;
 for(let b=0;b<B;b++){const x=b/B*sW,hh=Math.max(1,env[b]*top*.9);g.fillRect(x,top/2-hh/2,Math.max(1,sW/B-.5),hh)}
 g.fillStyle=acc;g.fillRect(f*sW-1,0,2,top+6);
 if(src&&ctx){const sr=ctx.sampleRate,sec=src.length/sr,fac=86400/sec,N=32768,p0=Math.floor(f*src.length),cnt=Math.max(1,Math.floor(N/W)),al=Math.max(0,(pa-.6)/.4);
  g.font='12px sans-serif';g.textAlign='right';g.fillStyle=acc;g.fillText('\u00d7'+Math.round(Math.pow(fac,ea))+'\u3000'+fmt(sec*Math.pow(fac,ea)),W-6,16);
  if(al>0){g.globalAlpha=al;g.strokeStyle=ln;g.lineWidth=1;g.beginPath();g.moveTo(f*sW,top+6);g.lineTo(0,dY);g.moveTo(f*sW,top+6);g.lineTo(W,dY);g.stroke();
   g.fillStyle=acc;const mid=dY+dH/2;
   for(let x=0;x<W;x+=2){let mn=0,mx=0;const s0=p0+Math.floor(x/W*N);for(let j=0;j<cnt*2;j+=4){const v=src[(s0+j)%src.length];if(v<mn)mn=v;if(v>mx)mx=v}
    const a=dH*.5*Math.pow(Math.sin(Math.PI*x/W),2);g.fillRect(x,mid-mx*a,1.5,Math.max(1,(mx-mn)*a))}
   g.fillStyle=dim;g.font='11px sans-serif';g.textAlign='left';g.fillText('\u3044\u307e\u9cf4\u3063\u3066\u3044\u308b\u7d04'+(N/sr).toFixed(1)+'\u79d2 \u2015 \u3053\u306e\u4e00\u77ac\u304c\u5f15\u304d\u5ef6\u3070\u3055\u308c\u3066\u97ff\u3044\u3066\u3044\u308b',6,dY+dH+13);g.globalAlpha=1}
  g.textAlign='center'}
 if(ana){const a=new Uint8Array(ana.frequencyBinCount);ana.getByteFrequencyData(a);const bars=96,y0=H-24;
  g.fillStyle=acc;for(let i=0;i<bars;i++){const k=Math.floor(Math.pow(i/bars,2)*a.length*.6)+1,v=a[k]/255;g.globalAlpha=.8;g.fillRect(i*W/bars,y0-v*(y0-sp),Math.max(1,W/bars-2),v*(y0-sp))}g.globalAlpha=1}
 const n=new Date(Date.now()+offH()*3600e3);
 $('clock').textContent=p2(n.getHours())+':'+p2(n.getMinutes())+':'+p2(n.getSeconds());
 if(src){const s=f*src.length/(ctx?ctx.sampleRate:1);$('pos').textContent='音源位置 '+Math.floor(s/60)+':'+p2(Math.floor(s%60))+'.'+Math.floor((s%1)*10)}
 requestAnimationFrame(draw)}
draw();
</script>
</body>
</html>
